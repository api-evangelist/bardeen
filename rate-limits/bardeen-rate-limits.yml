description: >-
  Bardeen publishes no API rate limits, because Bardeen publishes no API. This file REPLACES a
  2026-05-04 bulk-sweep scaffold that asserted X-RateLimit-* response headers, 10 req/min on a
  free tier and 100 req/min on a professional tier — none of which Bardeen has ever documented,
  and none of which can exist without a callable endpoint. Searched on 2026-08-29: the pricing
  page publishes a credit meter, not a request meter; docs.bardeen.ai does not resolve (NXDOMAIN);
  /developer-program 301s to the homepage; the sitemap's 3,155 URLs contain no API, developer,
  webhook or SDK page. Consumption is bounded by monthly CREDITS (see
  plans/bardeen-plans-pricing.yml), which is a quota, not a rate limit.
