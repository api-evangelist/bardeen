aid: bardeen
name: Bardeen
description: Bardeen is an AI automation platform from Bardeen Inc (San Francisco, CA) that automates
  repetitive go-to-market work — web scraping, web search, contact and company enrichment, and AI-assisted
  data tasks — from a browser extension that runs against the sites and SaaS tools a user is already signed
  in to. Work is metered in credits rather than API calls, and automations can run locally in the browser
  or in Bardeen's cloud. The company also ships WIQ (getwiq.ai), a Workflow Intelligence Platform that
  reconstructs how work actually happens from browser and system-of-record data. Bardeen consumes other
  people's APIs through native connectors and generic HTTP actions; it publishes no public API of its
  own.
