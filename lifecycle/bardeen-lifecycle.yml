description: >-
  Lifecycle posture for Bardeen, read from the company's own public surface on 2026-08-29. Bardeen
  ships a browser-extension automation product, not an API, so most of the API lifecycle surface
  (version headers, sunset policy, deprecation windows, an SLA against a callable endpoint) does
  not exist. What DOES exist is a semver-versioned product changelog. What is absent — and would be
  absent for any buyer looking for it — is a status page, a deprecation policy, and a published SLA.
